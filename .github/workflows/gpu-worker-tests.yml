name: GPU Worker Smoke Tests
on:
  pull_request:
    paths:
      - "gpu-worker/**"
      - ".github/workflows/gpu-worker-tests.yml"
  push:
    branches: ["feature/vast-gpu-provider"]
    paths:
      - "gpu-worker/**"
      - ".github/workflows/gpu-worker-tests.yml"
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r gpu-worker/requirements.txt
      - run: python -m pytest -q gpu-worker/test_app.py
        working-directory: .
