name: Claude Platform Integration Validation
on:
  push:
    branches: ["feature/claude-complete-vast-integration"]
  pull_request:
    paths:
      - "integration/**"
      - ".github/workflows/claude-platform-validation.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Claude patch against current base
        run: git apply --check integration/claude-platform.patch
      - name: Apply Claude platform patch
        run: git apply integration/claude-platform.patch
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
