name: Cloud selftest (temporary)
on:
  push:
    branches: [cloud-selftest]
permissions:
  contents: write
jobs:
  discover:
    uses: ./.github/workflows/studio-cloud.yml
    with: {task: discover, request_id: selftest-discover}
    secrets: inherit
  generate:
    needs: discover
    if: always()
    uses: ./.github/workflows/studio-cloud.yml
    with:
      task: generate
      request_id: scene-selftest-01
      request: '{"prompt":"A teacher writes Arabic calligraphy on a whiteboard in a bright modern classroom, warm morning light, slow cinematic dolly-in","duration":3}'
    secrets: inherit
  finish:
    needs: generate
    if: always()
    uses: ./.github/workflows/studio-cloud.yml
    with:
      task: finish
      request_id: film-selftest-01
      request: '{"clips":["https://github.com/Elsa1172014/ai-video-studio/releases/download/films/scene-selftest-01.mp4","https://github.com/Elsa1172014/ai-video-studio/releases/download/films/scene-selftest-01.mp4"],"finish":{"aspect":"16:9","transition":"dissolve","grade":"cinematic","vignette":0.3,"grain":0.02,"letterbox":true,"fade":0.6,"titleCard":{"title":"رفيقُ العربية الذكي","subtitle":"اختبار المسار السحابي المجاني","duration":3},"captions":["يكتب المعلّم الخطّ العربي على اللوح.","العربية تستحق أن تُحَبّ."]}}'
    secrets: inherit
