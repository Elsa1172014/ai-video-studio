name: Provision approved Vast Wan Preview
on:
  push:
    branches: [feature/claude-complete-vast-integration]
    paths:
      - .github/workflows/vast-provision-preview.yml
      - .github/vast-provision-request.txt
      - scripts/provision-wan-preview.sh
permissions:
  contents: read
concurrency:
  group: vast-preview-provision
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install reviewed Wan runtime on existing instance
        env:
          VAST_SSH_PRIVATE_KEY: ${{ secrets.VAST_PREVIEW_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          STUDIO_TMP=$(mktemp -d)
          trap 'rm -rf "$STUDIO_TMP"' EXIT
          test -n "$VAST_SSH_PRIVATE_KEY"
          printf '%s\n' "$VAST_SSH_PRIVATE_KEY" > "$STUDIO_TMP/key"
          unset VAST_SSH_PRIVATE_KEY
          SSH_OPTS=(-i "$STUDIO_TMP/key" -p 15903 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$STUDIO_TMP/known_hosts")
          # Archive tracked runtime files only; never send git credentials or env files.
          git archive HEAD worker scripts | timeout 60 ssh "${SSH_OPTS[@]}" root@ssh8.vast.ai 'test "$CONTAINER_ID" = 55356791 && mkdir -p /workspace/ai-video-studio && tar -x -C /workspace/ai-video-studio'
          timeout 2100 ssh "${SSH_OPTS[@]}" root@ssh8.vast.ai 'bash /workspace/ai-video-studio/scripts/provision-wan-preview.sh'
          printf '%s\n' 'Approved instance 55356791 provisioned. No Production release, new rental, or inference job.' >> "$GITHUB_STEP_SUMMARY"
